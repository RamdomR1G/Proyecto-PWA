<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3f51b5">
  <link rel="apple-touch-icon" href="/src/images/icons/app-icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="UTEQGram">
  <title>Nuevo post - UTEQGram</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
  <link rel="stylesheet" href="/src/css/app.css">
  <style>
    .new-post-card {
      max-width: 480px;
      width: 90%;
      margin: 24px auto;
      padding: 24px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    .new-post-card .mdl-textfield {
      width: 100%;
    }
    #connection-status {
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      text-align: center;
    }
    #connection-status.online {
      background: #e8f5e9;
      color: #2e7d32;
    }
    #connection-status.offline {
      background: #fff3e0;
      color: #e65100;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .actions .mdl-button {
      flex: 1;
    }
  </style>
</head>
<body>

<div id="app">
  <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
    <header class="mdl-layout__header">
      <div class="mdl-layout__header-row">
        <span class="mdl-layout-title">UTEQGram</span>
        <div class="mdl-layout-spacer"></div>
        <nav class="mdl-navigation mdl-layout--large-screen-only">
          <a class="mdl-navigation__link" href="/">Feed</a>
          <a class="mdl-navigation__link" href="/new-post.html">Nuevo post</a>
        </nav>
      </div>
    </header>
    <div class="mdl-layout__drawer">
      <span class="mdl-layout-title">UTEQGram</span>
      <nav class="mdl-navigation">
        <a class="mdl-navigation__link" href="/">Feed</a>
        <a class="mdl-navigation__link" href="/new-post.html">Nuevo post</a>
      </nav>
    </div>

    <main class="mdl-layout__content mat-typography">
      <div class="new-post-card">
        <h5 class="mdl-color-text--primary" style="margin-top:0">Crear publicación</h5>

        <div id="connection-status" class="online">Conectado</div>

        <form id="new-post-form">
          <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
            <input class="mdl-textfield__input" type="text" id="title" required>
            <label class="mdl-textfield__label" for="title">Título</label>
          </div>

          <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
            <input class="mdl-textfield__input" type="text" id="location" required>
            <label class="mdl-textfield__label" for="location">Ubicación</label>
          </div>

          <div class="actions">
            <a href="/" class="mdl-button mdl-js-button mdl-button--raised">Cancelar</a>
            <button type="submit" id="post-btn"
                    class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent">
              Publicar
            </button>
          </div>
        </form>
      </div>

      <div id="confirmation-toast" aria-live="assertive" aria-atomic="true" aria-relevant="text"
           class="mdl-snackbar mdl-js-snackbar">
        <div class="mdl-snackbar__text"></div>
        <button type="button" class="mdl-snackbar__action"></button>
      </div>
    </main>
  </div>
</div>

<script defer src="/src/js/material.min.js"></script>
<script src="/src/js/idb.js"></script>
<script src="/src/js/utility.js"></script>
<script src="/src/js/app.js"></script>
<script src="/src/js/new-post.js"></script>
</body>
</html>
